name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Herdr
        run: curl -fsSL https://releases.herdr.dev/app/install.sh | sh

      - name: Put herdr-app on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Display and software Vulkan, for the app's runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1

      - name: herdr-app check
        run: |
          herdr-app --version
          xvfb-run -a herdr-app check mods/dockr
